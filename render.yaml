# Render Infrastructure-as-Code (Blueprint Specification)
# Target Deployment: Render Static Site (Frontend) + Render Web Service (Backend) + Supabase PostgreSQL

services:
  # ---------------------------------------------------------------------------
  # 1. FRONTEND WEB SERVICE (Static Site)
  # ---------------------------------------------------------------------------
  - type: web
    name: karmavaani-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://karmatute-ai-personalized-competency.onrender.com

  # ---------------------------------------------------------------------------
  # 2. BACKEND ENGINE SERVICE (Spring Boot Web Service)
  # ---------------------------------------------------------------------------
  - type: web
    name: karmatute-backend
    env: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    envVars:
      - key: PORT
        value: "8080"
      
      # SUPABASE POSTGRESQL CONFIGURATION (Configure in Render Dashboard / Secrets):
      - key: DATABASE_DRIVER
        value: org.postgresql.Driver
      - key: DATABASE_URL
        value: jdbc:postgresql://db.YOUR_SUPABASE_PROJECT.supabase.co:5432/postgres?sslmode=require
      - key: DATABASE_USERNAME
        value: postgres
      - key: DATABASE_PASSWORD
        sync: false # Set manually in Render Dashboard
      - key: DB_POOL_MAX_SIZE
        value: "5"
      - key: DB_POOL_MIN_IDLE
        value: "2"
      
      # MISTRAL AI INTEGRATION (Optional - Fallback to deterministic engine if unconfigured):
      - key: MISTRAL_API_KEY
        sync: false # Set manually in Render Dashboard

      # CORS ORIGIN RESTRICTION:
      - key: FRONTEND_ORIGIN
        value: https://karmatute.vercel.app,https://karmavaani-frontend.onrender.com
